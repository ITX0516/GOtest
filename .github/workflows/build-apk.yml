name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      engine_mode:
        description: 'Engine integration mode'
        required: false
        default: 'BUILTIN'
        type: choice
        options:
          - BUILTIN
          - PROCESS
          - DYLIB
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '26.3.11579264'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-apk:
    name: Build APK (${{ inputs.engine_mode || 'BUILTIN' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install required SDK packages
        run: |
          # 手动安装所需的 SDK 包，避免 packages 参数格式问题
          sdkmanager "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" || true
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" || true
          sdkmanager "cmake;${{ env.CMAKE_VERSION }}" || true
          # 打印已安装的包
          sdkmanager --list_installed 2>/dev/null || sdkmanager --list 2>/dev/null | head -30

      - name: Set ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Download KataGo source (BUILTIN mode)
        if: ${{ (inputs.engine_mode || 'BUILTIN') == 'BUILTIN' }}
        run: |
          chmod +x ./tools/download_katago_source.sh
          if [ -d "app/src/main/cpp/third_party/katago/cpp" ]; then
            echo "KataGo source already exists, skipping download."
          else
            yes "" | ./tools/download_katago_source.sh --branch v1.16.4
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Eigen headers (BUILTIN mode)
        if: ${{ (inputs.engine_mode || 'BUILTIN') == 'BUILTIN' }}
        run: |
          KATAGO_DIR="app/src/main/cpp/third_party/katago"
          EIGEN_DIR="$KATAGO_DIR/cpp/external/eigen"
          
          if [ -d "$KATAGO_DIR/.git" ] || [ -f "$KATAGO_DIR/.git" ]; then
            cd "$KATAGO_DIR"
            git submodule update --init --recursive 2>/dev/null || true
            cd -
          fi
          
          if [ ! -f "$EIGEN_DIR/Eigen/Core" ]; then
            echo "Eigen not found, downloading..."
            mkdir -p "$EIGEN_DIR"
            curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | \
              tar xz -C "$EIGEN_DIR" --strip-components=1
            echo "Eigen downloaded to $EIGEN_DIR"
          else
            echo "Eigen headers found at $EIGEN_DIR"
          fi

      - name: Set engine mode in build.gradle.kts
        run: |
          ENGINE_MODE="${{ inputs.engine_mode || 'BUILTIN' }}"
          echo "Setting WEIQI_ENGINE_MODE=$ENGINE_MODE"
          sed -i "s/-DWEIQI_ENGINE_MODE=[A-Z]*/-DWEIQI_ENGINE_MODE=$ENGINE_MODE/" app/build.gradle.kts
          echo "After sed:"
          grep "WEIQI_ENGINE_MODE" app/build.gradle.kts

      - name: Generate gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ls -la gradlew

      - name: Build APK (${{ inputs.build_type || 'debug' }})
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Building $BUILD_TYPE ..."
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Sign APK (release)
        if: ${{ inputs.build_type == 'release' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiqi-app-${{ inputs.engine_mode || 'BUILTIN' }}-${{ inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7
