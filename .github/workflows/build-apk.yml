name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      engine_mode:
        description: 'Engine integration mode'
        required: false
        default: 'PROCESS'
        type: choice
        options:
          - PROCESS
          - DYLIB
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '26.3.11579264'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-apk:
    name: Build APK (${{ inputs.engine_mode || 'PROCESS' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" || true
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" || true
          sdkmanager "cmake;${{ env.CMAKE_VERSION }}" || true

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Download KataGo source
        if: ${{ (inputs.engine_mode || 'PROCESS') != 'DYLIB' }}
        run: |
          chmod +x ./tools/download_katago_source.sh
          if [ ! -d "app/src/main/cpp/third_party/katago/cpp" ]; then
            yes "" | ./tools/download_katago_source.sh --branch v1.16.4
          else
            echo "KataGo source already exists."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Eigen headers
        if: ${{ (inputs.engine_mode || 'PROCESS') != 'DYLIB' }}
        run: |
          EIGEN_DIR="app/src/main/cpp/third_party/katago/cpp/external/eigen"
          if [ ! -f "$EIGEN_DIR/Eigen/Core" ]; then
            echo "Eigen not found, downloading..."
            mkdir -p "$EIGEN_DIR"
            curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | \
              tar xz -C "$EIGEN_DIR" --strip-components=1
          else
            echo "Eigen headers found at $EIGEN_DIR"
          fi

      - name: Build katago binary (arm64-v8a, armeabi-v7a)
        if: ${{ (inputs.engine_mode || 'PROCESS') != 'DYLIB' }}
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          KATAGO_SRC="app/src/main/cpp/third_party/katago/cpp"
          # NDK doesn't define BYTE_ORDER, patch affected files
          for f in core/sha2.cpp dataio/numpywrite.cpp neuralnet/desc.cpp; do
            sed -i '1s/^/#define BYTE_ORDER 1234\n#define LITTLE_ENDIAN 1234\n/' "$KATAGO_SRC/$f"
          done
          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== Building katago for $ABI ==="
            mkdir -p build-katago/$ABI
            cd build-katago/$ABI
            cmake "$GITHUB_WORKSPACE/$KATAGO_SRC" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_TOOLCHAIN" \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_CPU_ONLY=1 \
              -DNO_GIT_REVISION=1 \
              -DBUILD_TESTING=OFF
            cmake --build . -j$(nproc) --target katago
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/bin/$ABI"
            cp katago "$GITHUB_WORKSPACE/app/src/main/assets/bin/$ABI/katago"
            ls -lh "$GITHUB_WORKSPACE/app/src/main/assets/bin/$ABI/katago"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Set engine mode in build.gradle.kts
        run: |
          ENGINE_MODE="${{ inputs.engine_mode || 'PROCESS' }}"
          echo "Setting WEIQI_ENGINE_MODE=$ENGINE_MODE"
          sed -i "s/-DWEIQI_ENGINE_MODE=[A-Z]*/-DWEIQI_ENGINE_MODE=$ENGINE_MODE/" app/build.gradle.kts
          grep "WEIQI_ENGINE_MODE" app/build.gradle.kts

      - name: Generate gradlew if missing
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x gradlew

      - name: Build APK (${{ inputs.build_type || 'debug' }})
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Sign APK (release)
        if: ${{ inputs.build_type == 'release' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiqi-app-${{ inputs.engine_mode || 'PROCESS' }}-${{ inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7
