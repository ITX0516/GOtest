name: Download KataGo Weights

on:
  workflow_dispatch:
    inputs:
      weight_size:
        description: 'Weight size'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - b10
          - b18
          - b28

jobs:
  download-weights:
    name: Download KataGo weights
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download weights
        run: |
          chmod +x ./tools/download_weights.sh
          WEIGHT_SIZE="${{ inputs.weight_size }}"
          if [ "$WEIGHT_SIZE" = "all" ]; then
            ./tools/download_weights.sh --all
          else
            ./tools/download_weights.sh --size $WEIGHT_SIZE
          fi

      - name: List downloaded files
        run: |
          ls -lh app/src/main/assets/weights/

      - name: Upload weights artifact
        uses: actions/upload-artifact@v4
        with:
          name: katago-weights
          path: app/src/main/assets/weights/
          retention-days: 90
